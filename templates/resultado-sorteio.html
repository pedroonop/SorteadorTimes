<!DOCTYPE html>
<html>
<head>
	<title>Resultado do Sorteio</title>
</head>
<body>
	<h1>Resultado do Sorteio</h1>

	{% for time in times %}
		<h2>Time {{loop.index}}</h2>
		{% for jogador in time %}
			<li>{{ jogador[0] }} {{ jogador[1] }}</li>
		{% endfor %}
	{% endfor %}

</body>
</html>
