<!DOCTYPE html>
<html>
<head>
	<title>Resultado do Sorteio</title>
</head>
<body>
	<h1>Resultado do Sorteio</h1>

	{% for time in times %}
		<h2>Time {{loop.index}} - {{ medias[loop.index - 1] }}</h2>
		{% for jogador, nota in time %}
			<li>{{ jogador }} - {{ nota }}</li>
		{% endfor %}
		<br>
	{% endfor %}

	<button type="button" onclick="window.location.reload()">Sortear Novamente</button>
</body>
</html>
